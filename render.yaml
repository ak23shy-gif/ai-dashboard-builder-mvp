services:
  - type: web
    name: google-api-data-extractor-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ORIGIN
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: BACKEND_ALLOWED_HOSTS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_ADS_API_VERSION
        value: v25
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
